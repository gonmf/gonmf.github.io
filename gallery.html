    <style>
      #lightbox {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.92);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        align-items: center;
        justify-content: center;
      }

      #lightbox.active {
        display: flex;
      }

      #lightbox-img {
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
        border-radius: 2px;
        box-shadow: 0 8px 60px rgba(0,0,0,0.6);
        transition: opacity 0.2s ease;
        user-select: none;
        -webkit-user-drag: none;
      }

      #lightbox-img.fading {
        opacity: 0;
      }

      /* Nav buttons */
      .lb-btn {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0,0,0,0.4);
        border: 1px solid rgba(255,255,255,0.18);
        color: #fff;
        font-size: 22px;
        width: 48px;
        height: 64px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        transition: background 0.15s;
        z-index: 1002;
        -webkit-tap-highlight-color: transparent;
        outline: none;
      }
      @media (hover: hover) {
        .lb-btn:hover {
          background: rgba(255,255,255,0.18);
        }
      }

      #lb-prev { left: 12px; }
      #lb-next { right: 12px; }

      #lb-close {
        position: fixed;
        top: 14px;
        right: 16px;
        background: transparent;
        border: none;
        color: rgba(255,255,255,0.7);
        font-size: 30px;
        cursor: pointer;
        line-height: 1;
        z-index: 1001;
        transition: color 0.15s;
        padding: 4px 8px;
      }

      #lb-close:hover {
        color: #fff;
      }

      #lb-counter {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.5);
        font-size: 13px;
        letter-spacing: 0.04em;
        font-family: inherit;
        z-index: 1001;
        pointer-events: none;
      }

      .gallery a {
        cursor: pointer;

        const lbCounter = document.getElementById('lb-counter');
        const lbPrev = document.getElementById('lb-prev');
        const lbNext = document.getElementById('lb-next');
        const lbClose = document.getElementById('lb-close');

        const links = Array.from(gallery.querySelectorAll('a'));
        const srcs = links.map(a => a.getAttribute('href'));
        let current = 0;
        let pushedState = false;

        function openAt(index) {
          current = (index + srcs.length) % srcs.length;
          lbImg.classList.remove('fading');
          lbImg.src = srcs[current];
          lbImg.alt = 'Photo ' + (current + 1);
          lbCounter.textContent = (current + 1) + ' / ' + srcs.length;
          lightbox.classList.add('active');
          document.body.style.overflow = 'hidden';
          history.pushState(null, '', '');
          pushedState = true;
          lbClose.focus();
        }

        function close() {
          lightbox.classList.remove('active');
          document.body.style.overflow = '';
          lbImg.src = '';
          links[current].focus();
          if (pushedState) {
            pushedState = false;
            history.back();
          }
        }

        function go(delta) {
          lbImg.classList.add('fading');
          setTimeout(() => {
            current = (current + delta + srcs.length) % srcs.length;
            lbImg.src = srcs[current];
            lbImg.alt = 'Photo ' + (current + 1);
            lbCounter.textContent = (current + 1) + ' / ' + srcs.length;
            lbImg.classList.remove('fading');
          }, 180);
        }

        links.forEach((a, i) => {
          a.addEventListener('click', e => {
            e.preventDefault();
            openAt(i);
          });
        });

        lbPrev.addEventListener('click', () => { go(-1); lbPrev.blur(); });
        lbNext.addEventListener('click', () => { go(1); lbNext.blur(); });
        lbClose.addEventListener('click', close);

        lightbox.addEventListener('click', e => {
          if (e.target === lightbox) close();
        });

        window.addEventListener('popstate', () => {
          if (lightbox.classList.contains('active')) {
            pushedState = false;
            close();
          }
        });

        document.addEventListener('keydown', e => {
          if (!lightbox.classList.contains('active')) return;
          if (e.key === 'ArrowLeft') go(-1);
          else if (e.key === 'ArrowRight') go(1);
          else if (e.key === 'Escape') close();
        });

        let touchStartX = null;
        lightbox.addEventListener('touchstart', e => {
          touchStartX = e.touches[0].clientX;
        }, { passive: true });
        lightbox.addEventListener('touchend', e => {
          if (touchStartX === null) return;
          const dx = e.changedTouches[0].clientX - touchStartX;
          if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
          touchStartX = null;
        }, { passive: true });
      })();
    </script>
  </body>
</html>
